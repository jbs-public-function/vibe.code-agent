[project]
name = "vibe"
version = "0.1.0"
description = "Local LLM dev environment: gRPC model controller, OpenAI-compatible gateway, zero-JS admin UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.115.0",
    "grpcio==1.83.1",
    "grpcio-health-checking==1.83.1",
    "httpx>=0.27.0",
    "huggingface-hub>=0.26.0",
    "jinja2>=3.1.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "nvidia-ml-py>=13.0.0",
    "protobuf>=5.26",
    "pyyaml>=6.0.2",
    "starlette>=0.41.0",
    "typer>=0.12.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.83.1",  # same version as grpcio: codegen must match the runtime (02-grpc-server risks)
    "pyright>=1.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "uv>=0.9.0",
]

[project.scripts]
vibe = "vibe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe"]

[tool.uv.workspace]
members = ["laboratory"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
